spring:
  application:
    name: bugtrail

  datasource:
    url: jdbc:postgresql://localhost:5432/bugtrail
    username: bugtrail
    password: bugtrail

  jpa:
    hibernate:
      # Never 'update' or 'create'. Flyway owns the schema; letting Hibernate also
      # modify it means two sources of truth and a schema you cannot reproduce.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.omarfraser.bugtrail: DEBUG

# Triage weights live here rather than in code so the model can be tuned without
# a recompile. They must sum to 1.0 — TriageWeights enforces it at construction.
bugtrail:
  triage:
    weights:
      severity: 0.40
      reach: 0.25
      reproducibility: 0.15
      regression: 0.12
      component: 0.08
